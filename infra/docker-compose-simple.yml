# Simplified Docker Compose for Kafka testing
# Includes: Redpanda (Kafka), Conduktor Console, Kafka UI, and required PostgreSQL services
#
# To configure external IP for EC2 deployment:
#   Option 1: Create .env file with REDPANDA_EXTERNAL_IP=your-ec2-public-ip
#   Option 2: Export environment variable: export REDPANDA_EXTERNAL_IP=your-ec2-public-ip
#   Defaults to localhost if not set (for local development)

services:
  # Conduktor Console, the enterprise UI.
  # It depends on PostgreSQL. 
  # https://docs.conduktor.io/platform/get-started/configuration/introduction/
  conduktor-console:
    image: conduktor/conduktor-console:1.40.0
    ports:
      - "8080:8080"
    volumes:
      - conduktor_data:/var/conduktor
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:change_me@postgresql:5432/conduktor-console"
      CDK_KAFKASQL_DATABASE_URL: "postgresql://conduktor:change_me@postgresql-sql:5432/conduktor-sql"
      CDK_ORGANIZATION_NAME: "getting-started"
      CDK_CLUSTERS_0_ID: "local-kafka"
      CDK_CLUSTERS_0_NAME: "local-kafka"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "redpanda-0:9092"
      CDK_CLUSTERS_0_SCHEMAREGISTRY_URL: "http://redpanda-0:18081"
      CDK_CLUSTERS_0_COLOR: "#6A57C8"
      CDK_CLUSTERS_0_ICON: "kafka"
    depends_on:
      redpanda-0:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      postgresql-2:
        condition: service_healthy

  # Conduktor stores its metadata in PostgreSQL.
  # Consider using an external managed database for production usage.
  # https://docs.conduktor.io/platform/get-started/configuration/database/
  postgresql:
    image: postgres:14
    hostname: postgresql
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_DB: "conduktor-console"
      POSTGRES_USER: "conduktor"
      POSTGRES_PASSWORD: "change_me"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduktor -d conduktor-console"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Conduktor depends on a separate db for storing Kafka data for SQL querying
  # It is optional, but required if you wish to use SQL functionality
  # Separate db ensures continued operation of the core Console experience if the SQL db becomes unavailable
  # https://docs.conduktor.io/platform/guides/configure-sql/
  postgresql-2:
    image: postgres:14
    hostname: postgresql-sql
    volumes:
      - pg_data_sql:/var/lib/postgresql/data
    environment:
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_DB: "conduktor-sql"
      POSTGRES_USER: "conduktor"
      POSTGRES_PASSWORD: "change_me"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduktor -d conduktor-sql"]
      interval: 10s
      timeout: 5s
      retries: 5

  # We use Redpanda to get started with Kafka as it's small and efficient.
  # This is an example here. For production, connect Conduktor to your own Kafka clusters.
  # 
  # For EC2 deployment with external access:
  # - Internal listener on port 9092 (for container-to-container communication)
  # - External PLAINTEXT listener on port 19092 (for external access)
  # - External SASL_PLAINTEXT listener on port 19093 (for external access with authentication)
  # - External IP is configured via REDPANDA_EXTERNAL_IP environment variable
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.6
    container_name: redpanda-0
    environment:
      # External IP for EC2 deployment (defaults to localhost for local development)
      REDPANDA_EXTERNAL_IP: ${REDPANDA_EXTERNAL_IP:-localhost}
      # SASL credentials (default: admin/admin, can be overridden via env file)
      REDPANDA_SASL_USER: ${REDPANDA_SASL_USER:-admin}
      REDPANDA_SASL_PASSWORD: ${REDPANDA_SASL_PASSWORD:-admin}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        exec /usr/bin/rpk redpanda start \
          --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
          --advertise-kafka-addr internal://redpanda-0:9092,external://$$REDPANDA_EXTERNAL_IP:19092 \
          --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081 \
          --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082 \
          --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082 \
          --rpc-addr redpanda-0:33145 \
          --advertise-rpc-addr redpanda-0:33145 \
          --mode dev-container
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    ports:
      - 18081:18081  # Schema Registry (external)
      - 18082:18082  # Pandaproxy (external)
      - 19092:19092  # Kafka PLAINTEXT (external)
      - 19093:19093  # Kafka SASL_PLAINTEXT (external)
      - 19644:9644   # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Kafka UI provides an alternative web interface for managing and monitoring Kafka.
  # Access it at http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda-0:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://redpanda-0:8081
    depends_on:
      redpanda-0:
        condition: service_healthy

volumes:
  pg_data: {}
  pg_data_sql: {}
  conduktor_data: {}
  redpanda-0: {}
