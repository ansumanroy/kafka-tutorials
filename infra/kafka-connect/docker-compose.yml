version: '3.8'

services:
  kafka-connect:
    image: apache/camel-kafka-connector:latest
    container_name: kafka-connect
    hostname: kafka-connect
    ports:
      - "${KAFKA_CONNECT_REST_PORT:-8083}:8083"
    environment:
      # Kafka Connect Worker Configuration
      CONNECT_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
      CONNECT_REST_HOST_NAME: "0.0.0.0"
      CONNECT_REST_PORT: "${KAFKA_CONNECT_REST_PORT:-8083}"
      CONNECT_REST_ADVERTISED_HOST_NAME: "localhost"
      CONNECT_REST_ADVERTISED_PORT: "${KAFKA_CONNECT_REST_PORT:-8083}"
      
      # Group and Offset Management
      CONNECT_GROUP_ID: "kafka-connect-cluster"
      CONNECT_CONFIG_STORAGE_TOPIC: "connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "3"
      
      # Converter Configuration
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      
      # Internal Topic Configuration
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      
      # Security Configuration (if using SASL/SSL)
      CONNECT_SECURITY_PROTOCOL: "${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}"
      CONNECT_SASL_MECHANISM: "${KAFKA_SASL_MECHANISM:-}"
      CONNECT_SASL_JAAS_CONFIG: "${KAFKA_SASL_JAAS_CONFIG:-}"
      
      # Plugin Configuration
      CONNECT_PLUGIN_PATH: "/kafka/connect"
      
      # Worker Configuration
      CONNECT_TASK_SHUTDOWN_GRACEFUL_TIMEOUT_MS: "10000"
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: "10000"
      CONNECT_ERRORS_RETRY_TIMEOUT: "0"
      CONNECT_ERRORS_RETRY_DELAY_MAX_MS: "60000"
      CONNECT_ERRORS_LOG_ENABLE: "true"
      CONNECT_ERRORS_LOG_INCLUDE_MESSAGES: "true"
      
      # JVM Options
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms512M"
      
      # AWS Configuration
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      # If using IAM roles, leave these empty - EC2 instance role will be used
      
    volumes:
      - ./connect-distributed.properties:/kafka/config/connect-distributed.properties:ro
      - ./connectors:/kafka/connect:ro
      - connect-data:/var/lib/kafka-connect/data
      - connect-logs:/var/lib/kafka-connect/logs
    
    networks:
      - kafka-connect-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${KAFKA_CONNECT_REST_PORT:-8083}/connectors"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  connect-data:
  connect-logs:

networks:
  kafka-connect-network:
    driver: bridge

