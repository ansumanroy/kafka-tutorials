# Kafka Connect Distributed Worker Configuration
# This file is used by Kafka Connect in distributed mode

# Bootstrap servers - will be overridden by environment variable
bootstrap.servers=${CONNECT_BOOTSTRAP_SERVERS}

# REST API Configuration
rest.host.name=0.0.0.0
rest.port=8083

# Group and Offset Management
group.id=kafka-connect-cluster
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status
config.storage.replication.factor=3
offset.storage.replication.factor=3
status.storage.replication.factor=3

# Converter Configuration
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Internal Topic Converters
internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable=false
internal.value.converter.schemas.enable=false

# Security Configuration (override with environment variables if needed)
security.protocol=${CONNECT_SECURITY_PROTOCOL:-PLAINTEXT}
sasl.mechanism=${CONNECT_SASL_MECHANISM:-}
sasl.jaas.config=${CONNECT_SASL_JAAS_CONFIG:-}

# SSL Configuration (if using SSL)
# ssl.truststore.location=/path/to/truststore.jks
# ssl.truststore.password=password
# ssl.keystore.location=/path/to/keystore.jks
# ssl.keystore.password=password

# Plugin Path
plugin.path=/kafka/connect

# Worker Configuration
task.shutdown.graceful.timeout.ms=10000
offset.flush.interval.ms=10000
offset.flush.timeout.ms=5000

# Error Handling
errors.retry.timeout=0
errors.retry.delay.max.ms=60000
errors.log.enable=true
errors.log.include.messages=true
errors.tolerance=none

# Producer Configuration (for Connect internal topics)
producer.buffer.memory=67108864
producer.compression.type=snappy
producer.max.in.flight.requests.per.connection=5
producer.batch.size=32768

# Consumer Configuration
consumer.max.poll.records=500
consumer.max.poll.interval.ms=300000
consumer.session.timeout.ms=30000
consumer.heartbeat.interval.ms=10000

# Request Timeouts
request.timeout.ms=305000
connections.max.idle.ms=540000

# Metrics and Monitoring
metric.reporters=
metrics.recording.level=INFO

