plugins {
    id 'java'
    id 'application'
}

group = 'com.kafkatutorials.streams'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        url 'https://packages.confluent.io/maven/'
    }
}

dependencies {
    implementation 'org.apache.kafka:kafka-streams:3.6.1'
    implementation 'org.apache.kafka:kafka-clients:3.6.1'
    testImplementation 'org.apache.kafka:kafka-streams-test-utils:3.6.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'KAFKA_BOOTSTRAP_SERVERS', System.getenv('KAFKA_BOOTSTRAP_SERVERS') ?: 'localhost:9092'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.kafkatutorials.streams.joins.StreamStreamJoin'
}

tasks.register('runStreamJoin', JavaExec) {
    description = 'Run stream-stream join demo'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkatutorials.streams.joins.StreamStreamJoin'
    environment 'KAFKA_BOOTSTRAP_SERVERS', System.getenv('KAFKA_BOOTSTRAP_SERVERS') ?: 'localhost:9092'
}

tasks.register('runTableJoin', JavaExec) {
    description = 'Run stream-table join demo'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkatutorials.streams.joins.StreamTableJoin'
    environment 'KAFKA_BOOTSTRAP_SERVERS', System.getenv('KAFKA_BOOTSTRAP_SERVERS') ?: 'localhost:9092'
}
