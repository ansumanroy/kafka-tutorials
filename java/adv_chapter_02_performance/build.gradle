plugins {
    id 'java'
    id 'application'
}

group = 'com.kafkatutorials'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Kafka clients
    implementation 'org.apache.kafka:kafka-clients:3.6.1'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'
    
    // JSON processing for results
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    
    // Pass environment variables to tests
    systemProperty 'KAFKA_BOOTSTRAP_SERVERS', System.getenv('KAFKA_BOOTSTRAP_SERVERS')
    systemProperty 'KAFKA_SECURITY_PROTOCOL', System.getenv('KAFKA_SECURITY_PROTOCOL')
    systemProperty 'KAFKA_SASL_MECHANISM', System.getenv('KAFKA_SASL_MECHANISM')
    systemProperty 'KAFKA_SASL_USERNAME', System.getenv('KAFKA_SASL_USERNAME')
    systemProperty 'KAFKA_SASL_PASSWORD', System.getenv('KAFKA_SASL_PASSWORD')
    
    // Increase timeout for performance tests
    systemProperty 'junit.jupiter.execution.timeout.default', '10m'
    
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.kafkatutorials.performance.ThroughputBenchmark'
}

tasks.register('runBenchmark', JavaExec) {
    description = 'Run throughput benchmark with default settings'
    group = 'application'
    
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkatutorials.performance.ThroughputBenchmark'
    
    // Pass environment variables
    environment 'KAFKA_BOOTSTRAP_SERVERS', System.getenv('KAFKA_BOOTSTRAP_SERVERS') ?: 'localhost:9092'
}

tasks.register('runPerformanceTests', Test) {
    description = 'Run performance benchmark tests'
    group = 'verification'
    
    useJUnitPlatform {
        includeTags 'performance'
    }
}

tasks.register('runCompressionTests', Test) {
    description = 'Run compression comparison tests'
    group = 'verification'
    
    useJUnitPlatform {
        includeTags 'compression'
    }
}

tasks.register('runAllPerformanceTests', Test) {
    description = 'Run all performance-related tests'
    group = 'verification'
    
    useJUnitPlatform {
        includeTags 'performance | compression'
    }
}
