plugins {
    id 'java'
    id 'application'
}

group = 'com.kafkatutorials'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Kafka clients
    implementation 'org.apache.kafka:kafka-clients:3.6.1'
    
    // JSON processing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Micrometer for metrics
    implementation 'io.micrometer:micrometer-core:1.12.0'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    
    // Pass environment variables
    systemProperty 'KAFKA_BOOTSTRAP_SERVERS', System.getenv('KAFKA_BOOTSTRAP_SERVERS')
    
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.kafkatutorials.circuitbreaker.CircuitBreakerDemo'
}

tasks.register('runCircuitBreakerDemo', JavaExec) {
    description = 'Run circuit breaker demonstration'
    group = 'application'
    
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kafkatutorials.circuitbreaker.CircuitBreakerDemo'
    
    environment 'KAFKA_BOOTSTRAP_SERVERS', System.getenv('KAFKA_BOOTSTRAP_SERVERS') ?: 'localhost:9092'
}

tasks.register('runCircuitBreakerTests', Test) {
    description = 'Run circuit breaker tests'
    group = 'verification'
    
    useJUnitPlatform {
        includeTags 'circuit-breaker'
    }
}

tasks.register('runIntegrationTests', Test) {
    description = 'Run integration tests'
    group = 'verification'
    
    useJUnitPlatform {
        includeTags 'integration'
    }
}
